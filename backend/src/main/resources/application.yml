spring:
  application:
    name: ai-cooker-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_cooker_business?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${IMAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${IMAGE_MAX_REQUEST_SIZE:11MB}

server:
  port: ${SERVER_PORT:8080}

ai:
  cooker:
    base-url: ${AI_COOKER_BASE_URL:http://127.0.0.1:8000}
    connect-timeout: ${AI_COOKER_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_COOKER_READ_TIMEOUT:120s}

security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:ai-cooker-backend}
    ttl: ${JWT_TTL:1h}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    region: ${ALIYUN_OSS_REGION:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    signed-url-ttl: ${ALIYUN_OSS_SIGNED_URL_TTL:15m}
    max-file-size: ${IMAGE_MAX_FILE_SIZE:10MB}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
