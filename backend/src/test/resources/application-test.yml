spring:
  datasource:
    url: jdbc:h2:mem:ai_cooker_business;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # H2 maps MySQL LONGTEXT to VARCHAR in JDBC metadata, so Hibernate's
      # production CLOB validation produces a false type mismatch in tests.
      # Flyway still creates the complete schema before integration tests run.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

security:
  jwt:
    secret: test-only-jwt-secret-with-at-least-32-bytes
    issuer: ai-cooker-backend-test
    ttl: 1h

aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    region: cn-hangzhou
    bucket-name: ai-cooker-test
    access-key-id: test-access-key-id
    access-key-secret: test-access-key-secret
    signed-url-ttl: 15m
    max-file-size: 10MB
